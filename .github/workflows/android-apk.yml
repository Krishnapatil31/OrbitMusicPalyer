name: Build Orbit Music Player APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Prepare and validate Spotify SDK AAR
        env:
          SPOTIFY_APP_REMOTE_AAR_BASE64: ${{ secrets.SPOTIFY_APP_REMOTE_AAR_BASE64 }}
        run: |
          mkdir -p app/libs
          AAR="app/libs/spotify-app-remote-release-0.8.0.aar"
          if [ ! -s "$AAR" ] && [ -n "$SPOTIFY_APP_REMOTE_AAR_BASE64" ]; then
            printf '%s' "$SPOTIFY_APP_REMOTE_AAR_BASE64" | base64 --decode > "$AAR"
          fi
          if [ ! -s "$AAR" ]; then
            echo "::error::Missing Spotify App Remote SDK AAR in app/libs."
            exit 1
          fi
          if ! unzip -tq "$AAR"; then
            echo "::error::Spotify App Remote AAR is not a valid ZIP archive. Replace the AAR with a fresh official SDK download."
            exit 1
          fi
      - name: Build APK
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Show APK signing certificate fingerprint
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitMusicPlayer-v1.1.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
