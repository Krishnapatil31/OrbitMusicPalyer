name: Build Orbit Music Player APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Restore private Spotify SDK AAR
        env:
          SPOTIFY_APP_REMOTE_AAR_BASE64: ${{ secrets.SPOTIFY_APP_REMOTE_AAR_BASE64 }}
        run: |
          mkdir -p app/libs
          if [ -n "$SPOTIFY_APP_REMOTE_AAR_BASE64" ]; then
            printf '%s' "$SPOTIFY_APP_REMOTE_AAR_BASE64" | base64 --decode > app/libs/spotify-app-remote-release-0.8.0.aar
          fi
          if [ ! -s app/libs/spotify-app-remote-release-0.8.0.aar ]; then
            echo "::error::Missing Spotify App Remote SDK AAR. Add the official AAR as the SPOTIFY_APP_REMOTE_AAR_BASE64 Actions secret."
            exit 1
          fi
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitMusicPlayer-v1.1.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
